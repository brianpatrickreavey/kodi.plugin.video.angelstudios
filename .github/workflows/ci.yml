name: CI Test and Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_call:

env:
  PYTHON_VERSIONS: '["3.9", "3.10", "3.11", "3.12"]'
  KODI_BRANCHES: '["omega", "nexus", "piers"]'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.config.outputs.test_matrix }}
      validate_matrix: ${{ steps.config.outputs.validate_matrix }}
    steps:
      - id: config
        run: |
          echo "test_matrix={\"python-version\":${PYTHON_VERSIONS}}" >> $GITHUB_OUTPUT
          echo "validate_matrix={\"python-version\":${PYTHON_VERSIONS},\"kodi-branch\":${KODI_BRANCHES}}" >> $GITHUB_OUTPUT

  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0  # Fetch full history for git operations

    - name: Set up uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      with:
        version: "0.13.6"

    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run tests with coverage
      run: uv run make unittest-with-coverage

  validate:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.validate_matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      with:
        version: "0.13.6"

    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --group dev

    - name: Clean addon
      run: make clean-addon

    - name: Validate addon
      run: uv run kodi-addon-checker --branch ${{ matrix.kodi-branch }} plugin.video.angelstudios

  zip:
    name: zip installs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the release zip unpacks as one addon
        run: bash tools/build_release_zip.sh plugin.video.angelstudios